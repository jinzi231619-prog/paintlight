<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Temporary responsive layout check</title>
<style>body{margin:16px;background:#eceae4;font:16px system-ui}header{display:flex;gap:20px;align-items:center;margin-bottom:12px}iframe{display:block;border:1px solid #777;background:white;height:820px;width:390px}select{font:inherit;padding:8px}</style></head>
<body><header><label>Viewport <select id="size"><option value="390">390 px</option><option value="320">320 px</option><option value="430">430 px</option><option value="700">700 px</option><option value="1000">1000 px</option></select></label><span>Temporary QA preview</span></header>
<iframe id="preview" title="Paintlight responsive preview" src="/"></iframe>
<script>document.getElementById('size').addEventListener('change',event=>{document.getElementById('preview').style.width=event.target.value+'px';});</script>
</body></html>
